plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT' apply(false)
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply(false)
    id 'com.modrinth.minotaur' version '2.+' apply(false)
}

def mcVersionProfiles = [
        '1.20.5': [fabricApi: '0.97.8+1.20.5', forge: null, forgeLoaderRange: null, midnightLib: '1.5.5-fabric', modMenu: '10.0.0'],
        '1.20.6': [fabricApi: '0.100.8+1.20.6', forge: '50.2.4', forgeLoaderRange: '[50,)', midnightLib: '1.5.5-fabric', modMenu: '10.0.0'],
        '1.21'  : [fabricApi: '0.100.8+1.21', forge: '51.0.33', forgeLoaderRange: '[51,)', midnightLib: '1.6.9+1.21-fabric', modMenu: '11.0.4'],
        '1.21.1': [fabricApi: '0.116.9+1.21.1', forge: '52.1.14', forgeLoaderRange: '[52,)', midnightLib: '1.9.2+1.21.1-fabric', modMenu: '11.0.4'],
        '1.21.3': [fabricApi: '0.114.1+1.21.3', forge: '53.1.10', forgeLoaderRange: '[53,)', midnightLib: '1.9.2+1.21.1-fabric', modMenu: '11.0.4', fabricGameVersions: ['1.21.2', '1.21.3']],
        '1.21.4': [fabricApi: '0.115.1+1.21.4', forge: '54.1.16', forgeLoaderRange: '[54,)', midnightLib: '1.7.1+1.21.4-fabric', modMenu: '13.0.1', fabricGameVersions: ['1.21.4']],
]

def selectedProfile = mcVersionProfiles[minecraft_version]
if (selectedProfile == null) {
    throw new GradleException("Unsupported minecraft_version '${minecraft_version}'. Supported: ${mcVersionProfiles.keySet().join(', ')}")
}

ext.fabric_version = selectedProfile.fabricApi
ext.forge_version = selectedProfile.forge ?: "disabled-for-${minecraft_version}"
ext.forge_loader_version_range = selectedProfile.forgeLoaderRange ?: "[0,)"
ext.midnightlib_version = selectedProfile.midnightLib
ext.modmenu_version = selectedProfile.modMenu
ext.fabric_modrinth_game_versions = selectedProfile.fabricGameVersions ?: [minecraft_version]

tasks.register('verifyOggAssets') {
    group = 'verification'
    description = 'Validates every bundled OGG page, checksum, and end-of-stream marker.'
    def oggFiles = fileTree('common/src/main/resources') { include '**/*.ogg' }
    inputs.files(oggFiles)

    doLast {
        oggFiles.each { oggFile ->
            byte[] data = oggFile.bytes
            int offset = 0
            boolean foundEndOfStream = false
            while (offset < data.length) {
                if (offset + 27 > data.length || new String(data, offset, 4, 'US-ASCII') != 'OggS') {
                    throw new GradleException("Malformed OGG capture pattern at byte ${offset}: ${oggFile}")
                }
                int segmentCount = data[offset + 26] & 0xFF
                int headerEnd = offset + 27 + segmentCount
                if (headerEnd > data.length) throw new GradleException("Truncated OGG header: ${oggFile}")
                int payloadLength = 0
                for (int index = offset + 27; index < headerEnd; index++) payloadLength += data[index] & 0xFF
                int pageEnd = headerEnd + payloadLength
                if (pageEnd > data.length) throw new GradleException("Truncated OGG page: ${oggFile}")

                long expected = 0L
                for (int index = 0; index < 4; index++) expected |= (long) (data[offset + 22 + index] & 0xFF) << (index * 8)
                long checksum = 0L
                for (int index = offset; index < pageEnd; index++) {
                    int value = index >= offset + 22 && index < offset + 26 ? 0 : data[index] & 0xFF
                    checksum ^= (long) value << 24
                    for (int bit = 0; bit < 8; bit++) {
                        checksum = (checksum & 0x80000000L) != 0L
                                ? ((checksum << 1) ^ 0x04C11DB7L) & 0xFFFFFFFFL
                                : (checksum << 1) & 0xFFFFFFFFL
                    }
                }
                if (checksum != expected) throw new GradleException("Invalid OGG checksum at byte ${offset}: ${oggFile}")
                foundEndOfStream |= (data[offset + 5] & 0x04) != 0
                offset = pageEnd
            }
            if (!foundEndOfStream) throw new GradleException("OGG has no end-of-stream page: ${oggFile}")
        }
    }
}

gradle.projectsEvaluated {
    project(':common').tasks.named('processResources').configure {
        dependsOn(rootProject.tasks.named('verifyOggAssets'))
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Publishes all configured loader artifacts to Modrinth without changing the project body.'

    dependsOn(':fabric:modrinth')

    if (findProject(':forge') != null) {
        dependsOn(':forge:modrinth')
    }
}

tasks.register('syncModrinthBody') {
    group = 'publishing'
    description = 'Syncs the Modrinth project body separately from version publishing.'

    dependsOn(':fabric:modrinthSyncBody')
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Builds every configured loader artifact to catch cross-loader regressions before release.'

    dependsOn(':fabric:build')

    if (findProject(':forge') != null) {
        dependsOn(':forge:build')
    }
}

tasks.register('syncReleaseMetadata') {
    group = 'release'
    description = 'Writes the requested release version to gradle.properties and prepends a matching CHANGELOG entry.'

    doLast {
        def releaseVersion = normalizedReleaseVersion()
        def propsFile = file('gradle.properties')
        def changelogFile = file('CHANGELOG.md')

        def propsText = propsFile.getText('UTF-8')
        if (!(propsText =~ /(?m)^version=/).find()) {
            throw new GradleException("Could not find a version= line in ${propsFile}.")
        }
        def updatedPropsText = propsText.replaceFirst(/(?m)^version=.*/, "version=${releaseVersion}")
        if (propsText != updatedPropsText) {
            propsFile.write(updatedPropsText, 'UTF-8')
        }

        def changelogHeader = "## ${releaseVersion}"
        def changelogText = changelogFile.exists() ? changelogFile.getText('UTF-8') : "# Changelog\n\n"
        if (!changelogText.contains(changelogHeader)) {
            def changelogEntry = new StringBuilder()
            changelogEntry.append(changelogHeader).append('\n\n')
            releaseChangelogLines().each { line ->
                changelogEntry.append('- ').append(line).append('\n')
            }
            changelogEntry.append('\n')

            def updatedChangelogText = changelogText.replaceFirst(/(?s)^# Changelog\s*/, "# Changelog\n\n${changelogEntry}")
            if (updatedChangelogText == changelogText) {
                updatedChangelogText = "# Changelog\n\n${changelogEntry}${changelogText}"
            }
            changelogFile.write(updatedChangelogText, 'UTF-8')
        }
    }
}

tasks.register('releaseModrinth') {
    group = 'release'
    description = 'Updates local release metadata, verifies Fabric/Forge builds, then publishes both loaders to Modrinth.'

    dependsOn('syncReleaseMetadata')
    dependsOn('verifyAll')
    dependsOn('publishModrinth')
}

plugins {
    id 'base'
    id 'com.modrinth.minotaur' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.modrinth.minotaur'
    base.archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
    sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))
    repositories {
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
        maven { url = 'https://maven.terraformersmc.com/releases'; content { includeGroup 'com.terraformersmc' } }
    }
    processResources {
        def metadata = [version: project.version, mod_id: mod_id, mod_name: mod_name, mod_author: mod_author,
                        license: license, description: rootProject.description,
                        minecraft_version: minecraft_version, minecraft_version_range: "[${minecraft_version}]",
                        java_version: java_version, fabric_loader_version: fabric_loader_version,
                        forge_version: forge_version, forge_loader_version_range: "[${forge_version.tokenize('.')[0]},)",
                        forge_dependency_range: "[${forge_version},)", neoforge_version: neoforge_version]
        inputs.properties(metadata)
        filesMatching(['META-INF/*.toml', 'fabric.mod.json', 'pack.mcmeta', '*.mixins.json']) { expand(metadata) }
        if (project.name == 'neoforge' || minecraft_version.startsWith('26.') ||
                (project.name == 'forge' && !(minecraft_version in ['1.20.3', '1.20.4']))) {
            filesMatching('aioa.mixins.json') { filter { line -> line.contains('"refmap"') ? null : line } }
        }
    }
    jar { from(rootProject.file('LICENSE')) }
    afterEvaluate {
        modrinth {
            token = providers.environmentVariable('MODRINTH_TOKEN').orElse('').get()
            projectId = modrinth_project_id
            versionNumber = "${project.version}+mc${minecraft_version}-${project.name}"
            versionName = "AIOA ${project.version} · ${minecraft_version} · ${project.name}"
            versionType = modrinth_version_type
            changelog = rootProject.file('../../../../CHANGELOG.md').getText('UTF-8')
            uploadFile = tasks.named(project.name == 'fabric' && !minecraft_version.startsWith('26.') ? 'remapJar' : 'jar')
            gameVersions = [minecraft_version]
            loaders = project.name == 'fabric' ? ['fabric', 'quilt'] : [project.name]
            if (project.name == 'fabric') dependencies { required.project 'fabric-api' }
        }
    }
}
tasks.register('verifyAll') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.register('publishModrinth') { dependsOn subprojects.collect { it.tasks.named('modrinth') } }

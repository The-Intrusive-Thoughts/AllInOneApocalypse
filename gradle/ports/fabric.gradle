plugins { id 'fabric-loom' }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    if (midnightlib_version != '-') {
        modImplementation(include("maven.modrinth:midnightlib:${midnightlib_version}"))
    }
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
if (midnightlib_version == '-') sourceSets.main.java.exclude '**/AioaMidnightConfig.java'
loom.mixin {
    useLegacyMixinAp = true
    defaultRefmapName.set('aioa.refmap.json')
}

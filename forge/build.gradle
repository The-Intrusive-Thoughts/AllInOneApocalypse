plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'com.modrinth.minotaur'
}

def modrinthProjectId = providers.gradleProperty('modrinth_project_id').orElse('')
def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse('')
def modrinthVersionType = providers.gradleProperty('modrinth_version_type').orElse('release')
def modrinthChangelogFile = rootProject.file(providers.gradleProperty('modrinth_changelog_file').orElse('CHANGELOG.md').get())
def forgeReleaseName = "${mod_name} ${version} for Minecraft ${minecraft_version} (Forge)"
def forgeVersionNumber = "${version}+mc${minecraft_version}-forge"

def modrinthPublishConfigProblems = {
    def problems = []
    if (!modrinthProjectId.get().trim()) {
        problems << 'Set modrinth_project_id in gradle.properties before publishing to Modrinth.'
    }
    if (!modrinthToken.get().trim()) {
        problems << 'Set the MODRINTH_TOKEN environment variable before publishing to Modrinth.'
    }
    problems
}

def warnIfModrinthPublishConfigMissing = { String taskName ->
    def problems = modrinthPublishConfigProblems()
    if (!problems.isEmpty()) {
        logger.lifecycle("Skipping ${project.path}:${taskName} because Modrinth publishing is not configured:")
        problems.each { logger.lifecycle(" - ${it}") }
        return false
    }
    true
}

if (!forge_version) {
    throw new GradleException("Unsupported forge profile for minecraft_version=${minecraft_version}. Supported forge profiles in this project: 1.20.6, 1.21, 1.21.1 (Forge is not published for 1.20.5).")
}

def libsDir = file('libs')
def pickLibJar = { Closure<Boolean> matcher ->
    if (!libsDir.exists()) {
        return null
    }

    def jars = libsDir.listFiles()
            .findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith('.jar') }
            .sort { a, b -> b.name <=> a.name }

    def preferred = jars.find {
        def lower = it.name.toLowerCase(Locale.ROOT)
        matcher(lower) && lower.contains(minecraft_version)
    }
    if (preferred != null) {
        return preferred
    }

    return jars.find { matcher(it.name.toLowerCase(Locale.ROOT)) }
}

def yaclJar = pickLibJar { name -> name.startsWith('yet_another_config_lib_v3-') && name.contains('forge') }
def catalogueJar = pickLibJar { name -> name.startsWith('catalogue-') }
def configuredJar = pickLibJar { name -> name.startsWith('configured-') }
def clothConfigJar = pickLibJar { name -> name.startsWith('cloth-config-') && name.contains('forge') }
def superMartijnConfigLibJar = pickLibJar { name -> name.contains('supermartijn642') && name.contains('configlib') && name.contains('forge') }
def enableYaclRuntime = providers.gradleProperty('aioa.enableYaclRuntime')
        .orElse('false')
        .get()
        .toBoolean()
def enableOptionalConfigModsRuntime = providers.gradleProperty('aioa.forge.enableOptionalConfigModsRuntime')
        .orElse('false')
        .get()
        .toBoolean()

minecraft {
    mappings channel: 'official', version: minecraft_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
        }

        data {
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")
if (yaclJar == null || !yaclJar.exists()) {
    sourceSets.main.java.exclude 'com/flubburr/aioa/forge/config/AioaYaclConfigScreen.java'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly project(':common')
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.7'

    if (yaclJar != null && yaclJar.exists()) {
        compileOnly files(yaclJar)
        if (enableYaclRuntime) {
            runtimeOnly files(yaclJar)
        } else {
            logger.lifecycle("AIOA Forge setup: YACL runtime is disabled (compileOnly only). " +
                    'Use -Paioa.enableYaclRuntime=true once you have a dev-compatible YACL jar.')
        }
    }
    if (catalogueJar != null && catalogueJar.exists()) {
        compileOnly files(catalogueJar)
        if (enableOptionalConfigModsRuntime) {
            runtimeOnly files(catalogueJar)
        }
    }
    if (configuredJar != null && configuredJar.exists()) {
        compileOnly files(configuredJar)
        if (enableOptionalConfigModsRuntime) {
            runtimeOnly files(configuredJar)
        }
    }
    if (clothConfigJar != null && clothConfigJar.exists()) {
        compileOnly files(clothConfigJar)
        if (enableOptionalConfigModsRuntime) {
            runtimeOnly files(clothConfigJar)
        }
    }
    if (superMartijnConfigLibJar != null && superMartijnConfigLibJar.exists()) {
        compileOnly files(superMartijnConfigLibJar)
        if (enableOptionalConfigModsRuntime) {
            runtimeOnly files(superMartijnConfigLibJar)
        }
    }
}

if (yaclJar == null || !yaclJar.exists()) {
    logger.lifecycle('AIOA Forge setup: YACL jar not found in forge/libs. Forge will use the built-in fallback config screen.')
}
if (catalogueJar == null || !catalogueJar.exists()) {
    logger.lifecycle('AIOA Forge setup: Catalogue jar not found in forge/libs (optional).')
}
if (configuredJar == null || !configuredJar.exists()) {
    logger.lifecycle('AIOA Forge setup: Configured jar not found in forge/libs (optional).')
}
if (clothConfigJar == null || !clothConfigJar.exists()) {
    logger.lifecycle('AIOA Forge setup: Cloth Config jar not found in forge/libs (optional).')
}
if (superMartijnConfigLibJar == null || !superMartijnConfigLibJar.exists()) {
    logger.lifecycle('AIOA Forge setup: SuperMartijn642 Config Lib jar not found in forge/libs (optional).')
}
if (!enableOptionalConfigModsRuntime) {
    logger.lifecycle('AIOA Forge setup: Optional config-mod runtime loading is disabled. ' +
            'Use -Paioa.forge.enableOptionalConfigModsRuntime=true to load Catalogue / Configured / Cloth Config / SuperMartijn642 Config Lib in dev runs.')
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes([
            'MixinConfigs': "${mod_id}.mixins.json"
    ])
}

modrinth {
    token = modrinthToken.get()
    projectId = modrinthProjectId.get()
    versionNumber = forgeVersionNumber
    versionName = forgeReleaseName
    versionType = modrinthVersionType.get()
    changelog = modrinthChangelogFile.exists()
            ? modrinthChangelogFile.getText('UTF-8')
            : "Release ${forgeVersionNumber}"
    uploadFile = tasks.named('jar')
    gameVersions = [minecraft_version]
    loaders = ['forge']
}

tasks.named('modrinth').configure {
    dependsOn tasks.named('build')
    onlyIf {
        warnIfModrinthPublishConfigMissing(name)
    }
}

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'AIOA'
include("common")
include("fabric")

def localProperties = new Properties()
file("gradle.properties").withInputStream { localProperties.load(it) }
def selectedMinecraftVersion = (localProperties.getProperty("minecraft_version") ?: "").trim()

// Forge has no published artifacts for 1.20.5.
if (selectedMinecraftVersion == "1.20.5") {
    println("AIOA setup: Forge module disabled for Minecraft 1.20.5 (no Forge artifact published for this version).")
} else {
    include("forge")
}

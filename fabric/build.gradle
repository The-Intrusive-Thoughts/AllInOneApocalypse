plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.modrinth.minotaur'
}

def modrinthProjectId = providers.gradleProperty('modrinth_project_id').orElse('')
def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse('')
def modrinthVersionType = providers.gradleProperty('modrinth_version_type').orElse('release')
def modrinthGameVersions = providers.gradleProperty('modrinth_game_versions')
        .orElse(minecraft_version)
        .map { value -> value.split(',').collect { it.trim() }.findAll { !it.isEmpty() } }
def modrinthBodyFile = rootProject.file(providers.gradleProperty('modrinth_body_file').orElse('README.md').get())
def modrinthChangelogFile = rootProject.file(providers.gradleProperty('modrinth_changelog_file').orElse('CHANGELOG.md').get())
def fabricReleaseName = "${mod_name} ${version} for Minecraft ${modrinthGameVersions.get().join(' / ')} (Fabric)"
def fabricVersionNumber = "${version}+mc${modrinthGameVersions.get().first()}-fabric"

def requireModrinthPublishConfig = {
    if (!modrinthProjectId.get().trim()) {
        throw new GradleException('Set modrinth_project_id in gradle.properties before publishing to Modrinth.')
    }
    if (!modrinthToken.get().trim()) {
        throw new GradleException('Set the MODRINTH_TOKEN environment variable before publishing to Modrinth.')
    }
}

def libsDir = file('libs')
def pickLibJar = { Closure<Boolean> matcher ->
    if (!libsDir.exists()) {
        return null
    }

    def jars = libsDir.listFiles()
            .findAll { it.isFile() && it.length() > 0 && it.name.toLowerCase(Locale.ROOT).endsWith(".jar") }
            .sort { a, b -> b.name <=> a.name }

    def preferred = jars.find {
        def lower = it.name.toLowerCase(Locale.ROOT)
        matcher(lower) && lower.contains(minecraft_version)
    }
    if (preferred != null) {
        return preferred
    }

    return jars.find { matcher(it.name.toLowerCase(Locale.ROOT)) }
}

def modMenuJar = pickLibJar { name -> name.startsWith('modmenu-') }
def clothConfigJar = pickLibJar { name -> name.startsWith('cloth-config-') && name.contains('fabric') }
def superMartijnConfigLibJar = pickLibJar { name -> name.contains('supermartijn642') && name.contains('configlib') && name.contains('fabric') }
def enableModMenuRuntime = providers.gradleProperty("aioa.fabric.enableModMenuRuntime")
        .orElse("false")
        .get()
        .toBoolean()
def enableOptionalConfigModsRuntime = providers.gradleProperty("aioa.fabric.enableOptionalConfigModsRuntime")
        .orElse("false")
        .get()
        .toBoolean()

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // AIOA manual dependency placeholders:
    // - Drop Mod Menu into fabric/libs to override the default Maven version if needed.
    // - Optional compatibility jars can also live in fabric/libs:
    //   - cloth-config-...-fabric.jar
    //   - supermartijn642sconfiglib-...-fabric-...jar
    // These are loader-specific UI dependencies only; the shared gameplay logic stays in :common.
    // MidnightLib is resolved from Maven by minecraft_version profile for safer upgrades.
    // Mod Menu stays optional; enable runtime loading only when desired.
    modImplementation "maven.modrinth:midnightlib:${midnightlib_version}"
    def modMenuDep = "maven.modrinth:modmenu:${modmenu_version}"
    if (modMenuJar != null && modMenuJar.exists()) {
        modCompileOnly files(modMenuJar)
        if (enableModMenuRuntime) {
            modRuntimeOnly files(modMenuJar)
        } else {
            logger.lifecycle("AIOA Fabric setup: Mod Menu runtime is disabled (compile-only only). " +
                    "Use -Paioa.fabric.enableModMenuRuntime=true to load Mod Menu in dev runs.")
        }
    } else {
        modCompileOnly modMenuDep
        if (enableModMenuRuntime) {
            modRuntimeOnly modMenuDep
        }
    }
    if (clothConfigJar != null && clothConfigJar.exists()) {
        modCompileOnly files(clothConfigJar)
        if (enableOptionalConfigModsRuntime) {
            modRuntimeOnly files(clothConfigJar)
        }
    }
    if (superMartijnConfigLibJar != null && superMartijnConfigLibJar.exists()) {
        modCompileOnly files(superMartijnConfigLibJar)
        if (enableOptionalConfigModsRuntime) {
            modRuntimeOnly files(superMartijnConfigLibJar)
        }
    }
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

if (modMenuJar == null || !modMenuJar.exists()) {
    logger.lifecycle("AIOA Fabric setup: Mod Menu jar not found in fabric/libs (optional). Using Maven dependency modmenu:${modmenu_version}.")
}
if (clothConfigJar == null || !clothConfigJar.exists()) {
    logger.lifecycle("AIOA Fabric setup: Cloth Config jar not found in fabric/libs (optional).")
}
if (superMartijnConfigLibJar == null || !superMartijnConfigLibJar.exists()) {
    logger.lifecycle("AIOA Fabric setup: SuperMartijn642's Config Lib jar not found in fabric/libs (optional).")
}
if (!enableOptionalConfigModsRuntime) {
    logger.lifecycle("AIOA Fabric setup: Optional config-mod runtime loading is disabled. " +
            "Use -Paioa.fabric.enableOptionalConfigModsRuntime=true to load Cloth Config / SuperMartijn642 Config Lib in dev runs.")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.named("jar", Jar).configure {
    // MidnightLib is supplied as a normal dependency for dev/runtime and distribution.
}

tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    doFirst {
        delete fileTree("run/mods") {
            include "midnightlib*.jar"
        }
    }
}

modrinth {
    token = modrinthToken.get()
    projectId = modrinthProjectId.get()
    versionNumber = fabricVersionNumber
    versionName = fabricReleaseName
    versionType = modrinthVersionType.get()
    changelog = modrinthChangelogFile.exists()
            ? modrinthChangelogFile.getText('UTF-8')
            : "Release ${fabricVersionNumber}"
    uploadFile = tasks.named('remapJar')
    gameVersions = modrinthGameVersions.get()
    loaders = ['fabric']
    syncBodyFrom = modrinthBodyFile.exists()
            ? modrinthBodyFile.getText('UTF-8')
            : ''

    dependencies {
        required.project 'fabric-api'
        optional.project 'midnightlib'
        optional.project 'modmenu'
        optional.project 'cloth-config'
    }
}

tasks.named('modrinth').configure {
    dependsOn tasks.named('build')
    doFirst {
        requireModrinthPublishConfig()
    }
}

tasks.named('modrinthSyncBody').configure {
    doFirst {
        requireModrinthPublishConfig()
    }
}

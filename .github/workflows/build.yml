name: Build Minecraft versions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.java'
      - '**/src/main/resources/**'
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'tools/*.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read supported targets
        id: versions
        shell: python
        run: |
          import json, os, sys
          sys.path.insert(0, 'tools')
          from build_target import PROFILES, available_loaders
          targets = [
              dict(game=game, loader=loader, jdk=25 if game.startswith('26.') else 21)
              for game in PROFILES for loader in available_loaders(game)
          ]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('matrix=' + json.dumps({'include': targets}), file=out)

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/build_target.py ${{ matrix.game }} --loader ${{ matrix.loader }}

# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.2.0
group=com.flubburr.aioa
java_version=17

# Common
minecraft_version=1.20.1
mod_name=AIOA
mod_author=Flubburr, DarkFox
mod_id=aioa
license=CC0-1.0
credits=Flubburr, DarkFox
description=A simple spawning overhaul that turns Minecraft into a zombie apocalypse.
minecraft_version_range=[1.20.1, 1.20.2)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,48)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Use JAVA_HOME (or the runner JDK) instead of committing a machine-specific org.gradle.java.home.
# This keeps local development and CI portable across Windows/Linux/macOS.

# Forge: keep manual YACL jars compileOnly by default to avoid userdev mapping crashes.
# Enable only when your YACL jar is dev-compatible with this Forge environment.
aioa.enableYaclRuntime=false

# Forge: optional compatibility config/menu mods (Catalogue, Configured, Cloth Config, SuperMartijn642 Config Lib).
# Keep disabled unless you want those jars loaded in the Forge dev runtime.
aioa.forge.enableOptionalConfigModsRuntime=false

# Fabric: keep Mod Menu optional by default.
# Enable only when you want Mod Menu loaded in the Fabric dev runtime.
aioa.fabric.enableModMenuRuntime=false

# Fabric: optional compatibility config/menu mods (Cloth Config, SuperMartijn642 Config Lib).
# Keep disabled unless you want those jars loaded in the Fabric dev runtime.
aioa.fabric.enableOptionalConfigModsRuntime=false

# Modrinth publishing
# Set modrinth_project_id to your project slug or ID, then export MODRINTH_TOKEN with
# CREATE_VERSION and PROJECT_WRITE scopes before running publishModrinth.
modrinth_project_id=u1nPcVyt
modrinth_version_type=release
modrinth_body_file=README.md
modrinth_changelog_file=CHANGELOG.md
